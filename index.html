<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fbf1e3">
  <meta name="description" content="Join us for a gender reveal! A little pumpkin is on the way. Saturday, November 21, 2026 at 2:00 PM.">
  <title>Gender Reveal — A Little Pumpkin Is on the Way!</title>

  <!-- Replace YOUR-USERNAME and YOUR-REPOSITORY after creating your GitHub Pages site.
       Social preview images need an absolute, publicly accessible URL. -->
  <link rel="canonical" href="https://YOUR-USERNAME.github.io/YOUR-REPOSITORY/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Our Gender Reveal">
  <meta property="og:title" content="Join Us for a Gender Reveal!">
  <meta property="og:description" content="A little pumpkin is on the way! Saturday, November 21, 2026 at 2:00 PM. Tap to view the invitation and RSVP.">
  <meta property="og:url" content="https://YOUR-USERNAME.github.io/YOUR-REPOSITORY/">
  <meta property="og:image" content="https://YOUR-USERNAME.github.io/YOUR-REPOSITORY/invite.png">
  <meta property="og:image:alt" content="Autumn floral gender reveal invitation">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Join Us for a Gender Reveal!">
  <meta name="twitter:description" content="A little pumpkin is on the way! Tap to view the invitation and RSVP.">
  <meta name="twitter:image" content="https://YOUR-USERNAME.github.io/YOUR-REPOSITORY/invite.png">

  <style>
    :root {
      color-scheme: light;
      --rust: #ad3514;
      --cream: #fbf1e3;
      --ink: #44251b;
    }
    * { box-sizing: border-box; }
    html { background: var(--cream); }
    body {
      margin: 0;
      padding: max(12px, env(safe-area-inset-top)) 12px max(24px, env(safe-area-inset-bottom));
      min-height: 100vh;
      background: var(--cream);
      color: var(--ink);
      font-family: Georgia, "Times New Roman", serif;
      text-align: center;
    }
    main {
      width: min(100%, 760px);
      margin: 0 auto;
    }
    .invite-wrap {
      position: relative;
      width: 100%;
      line-height: 0;
      overflow: hidden;
      border-radius: 2px;
    }
    .invite-art {
      display: block;
      width: 100%;
      height: auto;
    }
    /* Transparent, accessible tap target centered over the artwork's orange RSVP button. */
    .image-rsvp {
      position: absolute;
      left: 48.9%;
      top: 75.75%;
      transform: translate(-50%, -50%);
      width: 20%;
      max-width: 220px;
      height: 4.3%;
      min-height: 44px;
      border-radius: 12px;
      background: transparent;
      text-decoration: none;
      line-height: normal;
      -webkit-tap-highlight-color: rgba(173, 53, 20, .18);
      touch-action: manipulation;
    }
    .image-rsvp:focus-visible {
      outline: 3px solid #276b8b;
      outline-offset: 2px;
      background: rgba(255,255,255,.08);
    }
    .backup {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 50px;
      margin: 18px auto 8px;
      padding: 13px 30px;
      border: 0;
      border-radius: 12px;
      background: var(--rust);
      color: #fff;
      font: 700 18px/1.2 Georgia, "Times New Roman", serif;
      text-decoration: none;
      box-shadow: 0 2px 5px rgba(68,37,27,.18);
      -webkit-tap-highlight-color: rgba(173, 53, 20, .2);
      touch-action: manipulation;
    }
    .backup:hover { background: #8f2b10; }
    .backup:focus-visible {
      outline: 3px solid #276b8b;
      outline-offset: 3px;
    }
    .hint {
      margin: 2px 0 0;
      font: 14px/1.5 Arial, sans-serif;
      color: #65483d;
    }
    @media (min-width: 760px) {
      body { padding-top: 24px; }
      .backup { margin-top: 22px; }
    }
  </style>
</head>
<body>
  <main>
    <div class="invite-wrap">
      <img
        class="invite-art"
        src="invite.png"
        width="1130"
        height="1392"
        alt="Join us for a gender reveal! A little pumpkin is on the way. Saturday, November 21, 2026 at 2:00 PM at the Rush Residence, 108 Prospect Ct, Santa Cruz, CA 95065."
      >
      <a
        class="image-rsvp"
        href="https://docs.google.com/forms/d/e/1FAIpQLSflctECKWj9mT5uq9cIemVz7KilOAhLXVZLDXpPCnF1qNIgfA/viewform?usp=header"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="RSVP to the gender reveal (opens Google Form)"
        title="RSVP"
      ></a>
    </div>

    <a
      class="backup"
      href="https://docs.google.com/forms/d/e/1FAIpQLSflctECKWj9mT5uq9cIemVz7KilOAhLXVZLDXpPCnF1qNIgfA/viewform?usp=header"
      target="_blank"
      rel="noopener noreferrer"
    >RSVP NOW</a>
    <p class="hint">Having trouble tapping the invitation? Use the RSVP button above.</p>
  </main>
</body>
</html>
